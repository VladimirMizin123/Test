workflows:
  ios_release_nocodesign:
    name: iOS Release (no codesign)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Get deps
        script: |
          flutter clean
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod repo update
          pod install
          cd ..
      - name: Build IPA (no codesign)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive